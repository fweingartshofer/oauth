services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    ports:
      - "8080:8080"
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: root
      KC_BOOTSTRAP_ADMIN_PASSWORD: toor
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm --verbose
    volumes:
      - ./keycloak/OAuth-realm.json:/opt/keycloak/data/import/OAuth-realm.json
